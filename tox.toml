env_list = ["3.14"]

[env_run_base]
description = "run the test suite with pytest"
deps = ["pytest>=9.1.1"]
commands = [
    [
        "pytest",
        { replace = "posargs", default = [
            "tests",
        ], extend = true },
    ],
]

[env.lint]
description = "run linters"
skip_install = true
deps = ["ruff"]
commands = [
    [
        "ruff",
        "check",
        { replace = "posargs", default = [
            ".",
        ], extend = true },
    ],
]
